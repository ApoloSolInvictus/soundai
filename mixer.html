<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SoundAI DJ | Pro Performance</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=JetBrains+Mono&display=swap" rel="stylesheet">
    <style>
        :root {
            --bp-green: #00ff88;
            --bp-dark: #0a0a0a;
            --bp-surface: #141414;
            --bp-border: #252525;
            --deck-a: #ff5500;
            --deck-b: #00ccff;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bp-dark);
            color: #efefef;
            overflow: hidden;
            height: 100vh;
            user-select: none;
        }

        .font-mono { font-family: 'JetBrains Mono', monospace; }

        /* Estilos Beatport DJ */
        .glass-panel {
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(10px);
            border: 1px solid var(--bp-border);
        }

        .waveform-container {
            height: 120px;
            background: #000;
            position: relative;
            overflow: hidden;
            border-radius: 8px;
            border: 1px solid #1a1a1a;
        }

        .playhead {
            position: absolute;
            left: 50%;
            top: 0;
            width: 2px;
            height: 100%;
            background: white;
            z-index: 10;
            box-shadow: 0 0 10px rgba(255,255,255,0.5);
        }

        /* Controles */
        input[type="range"] {
            appearance: none;
            background: #222;
            border-radius: 10px;
        }

        input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 12px;
            height: 24px;
            background: var(--bp-green);
            border-radius: 2px;
            cursor: pointer;
        }

        .knob-input {
            width: 48px;
            height: 48px;
            border-radius: 50%;
            border: 3px solid #333;
            background: conic-gradient(from 180deg, var(--bp-green) 0deg, #111 0deg);
            position: relative;
            cursor: ns-resize;
        }

        .knob-input::after {
            content: '';
            position: absolute;
            top: 5px;
            left: 50%;
            width: 2px;
            height: 10px;
            background: white;
            transform: translateX(-50%);
        }

        .btn-bp {
            @apply transition-all active:scale-95 disabled:opacity-30;
        }

        .led-indicator {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: #333;
        }

        .led-active { background: var(--bp-green); box-shadow: 0 0 5px var(--bp-green); }

        /* Animación Waveform */
        canvas {
            image-rendering: pixelated;
        }
    </style>
</head>
<body class="flex flex-col">

    <header class="h-14 border-b border-zinc-800 flex items-center justify-between px-6 bg-black z-50">
        <div class="flex items-center gap-4">
            <img src="https://raw.githubusercontent.com/ApoloSolInvictus/soundai/main/images/A-Mark-Logo-SC.png" class="w-8 h-8 rounded-full border border-zinc-700">
            <h1 class="font-bold tracking-tighter text-xl flex items-center gap-2">
                SOUNDAI <span class="text-[10px] bg-green-500 text-black px-1 rounded font-black mt-1">DJ PRO</span>
            </h1>
        </div>
        
        <div class="flex items-center gap-8">
            <div class="text-center">
                <p id="masterClock" class="font-mono text-xl text-green-400">124.00</p>
                <p class="text-[8px] uppercase tracking-widest text-zinc-500">Master BPM</p>
            </div>
            <div class="flex gap-1 items-center">
                <div class="w-32 h-2 bg-zinc-800 rounded-full overflow-hidden">
                    <div id="masterVu" class="h-full bg-gradient-to-r from-green-500 to-red-500 w-0 transition-all duration-75"></div>
                </div>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button class="px-4 py-1 bg-zinc-800 hover:bg-zinc-700 rounded text-xs font-bold transition">LOGIN</button>
            <div class="w-2 h-2 bg-green-500 rounded-full animate-pulse"></div>
        </div>
    </header>

    <main class="flex-1 flex flex-col overflow-hidden">
        
        <!-- Decks Section -->
        <div class="grid grid-cols-12 gap-2 p-2 flex-1 min-h-0">
            
            <!-- Deck A -->
            <section class="col-span-5 flex flex-col gap-2 h-full">
                <div class="glass-panel p-4 rounded-xl flex-1 flex flex-col">
                    <div class="flex justify-between items-start mb-4">
                        <div>
                            <span class="text-[10px] font-bold text-orange-500 border border-orange-500/30 px-2 py-0.5 rounded">DECK A</span>
                            <h2 id="titleA" class="text-2xl font-black truncate max-w-xs mt-1">Ready to Load...</h2>
                            <p class="text-zinc-500 text-xs font-medium">SoundAI AI Original</p>
                        </div>
                        <div class="text-right">
                            <p id="timeA" class="font-mono text-2xl text-orange-500">00:00.0</p>
                            <p id="remA" class="font-mono text-[10px] text-zinc-600">-00:00.0</p>
                        </div>
                    </div>

                    <div class="waveform-container mb-4">
                        <div class="playhead"></div>
                        <canvas id="canvasA" class="w-full h-full"></canvas>
                    </div>

                    <div class="flex items-center justify-between gap-6">
                        <div class="flex gap-2">
                            <button onclick="playDeck('A')" id="playBtnA" class="w-14 h-14 rounded-full bg-zinc-800 flex items-center justify-center hover:bg-orange-600 transition group">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                            <button onclick="cueDeck('A')" class="w-14 h-14 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center font-black text-xs hover:bg-zinc-600">CUE</button>
                        </div>
                        
                        <div class="flex-1 px-4">
                            <div class="flex justify-between text-[10px] font-bold text-zinc-500 mb-1">
                                <span>PITCH</span>
                                <span id="pitchValA">0.00%</span>
                            </div>
                            <input type="range" id="pitchA" min="0.9" max="1.1" step="0.001" value="1" class="w-full">
                        </div>
                    </div>
                </div>
            </section>

            <!-- Mixer Center -->
            <section class="col-span-2 glass-panel rounded-xl flex flex-col items-center py-6 px-4 gap-8">
                <div class="flex flex-col gap-6 items-center w-full">
                    <div class="flex justify-between w-full gap-4">
                        <div class="flex flex-col items-center gap-1">
                            <div class="knob-input" data-param="high" data-deck="A"></div>
                            <span class="text-[8px] font-bold text-zinc-500">HI</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="knob-input" data-param="high" data-deck="B"></div>
                            <span class="text-[8px] font-bold text-zinc-500">HI</span>
                        </div>
                    </div>
                    
                    <div class="flex justify-between w-full gap-4">
                        <div class="flex flex-col items-center gap-1">
                            <div class="knob-input" data-param="mid" data-deck="A"></div>
                            <span class="text-[8px] font-bold text-zinc-500">MID</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="knob-input" data-param="mid" data-deck="B"></div>
                            <span class="text-[8px] font-bold text-zinc-500">MID</span>
                        </div>
                    </div>

                    <div class="flex justify-between w-full gap-4">
                        <div class="flex flex-col items-center gap-1">
                            <div class="knob-input" data-param="low" data-deck="A"></div>
                            <span class="text-[8px] font-bold text-zinc-500">LOW</span>
                        </div>
                        <div class="flex flex-col items-center gap-1">
                            <div class="knob-input" data-param="low" data-deck="B"></div>
                            <span class="text-[8px] font-bold text-zinc-500">LOW</span>
                        </div>
                    </div>
                </div>

                <div class="flex-1 flex gap-8 py-4">
                    <input type="range" id="volA" orient="vertical" min="0" max="1" step="0.01" value="0.8" class="appearance-none w-2 h-full bg-zinc-800 rounded vertical-slider">
                    <input type="range" id="volB" orient="vertical" min="0" max="1" step="0.01" value="0.8" class="appearance-none w-2 h-full bg-zinc-800 rounded vertical-slider">
                </div>

                <div class="w-full flex flex-col items-center gap-2">
                    <span class="text-[8px] font-bold text-zinc-600 uppercase tracking-widest">Crossfader</span>
                    <input type="range" id="crossfader" min="0" max="1" step="0.01" value="0.5" class="w-full">
                </div>
            </section>

            <!-- Deck B -->
            <section class="col-span-5 flex flex-col gap-2 h-full">
                <div class="glass-panel p-4 rounded-xl flex-1 flex flex-col">
                    <div class="flex justify-between items-start mb-4 text-right">
                         <div class="text-left">
                            <p id="timeB" class="font-mono text-2xl text-cyan-400">00:00.0</p>
                            <p id="remB" class="font-mono text-[10px] text-zinc-600">-00:00.0</p>
                        </div>
                        <div>
                            <span class="text-[10px] font-bold text-cyan-400 border border-cyan-400/30 px-2 py-0.5 rounded">DECK B</span>
                            <h2 id="titleB" class="text-2xl font-black truncate max-w-xs mt-1">Ready to Load...</h2>
                            <p class="text-zinc-500 text-xs font-medium text-right">SoundAI AI Original</p>
                        </div>
                    </div>

                    <div class="waveform-container mb-4">
                        <div class="playhead"></div>
                        <canvas id="canvasB" class="w-full h-full"></canvas>
                    </div>

                    <div class="flex items-center justify-between gap-6">
                         <div class="flex-1 px-4">
                            <div class="flex justify-between text-[10px] font-bold text-zinc-500 mb-1">
                                <span>PITCH</span>
                                <span id="pitchValB">0.00%</span>
                            </div>
                            <input type="range" id="pitchB" min="0.9" max="1.1" step="0.001" value="1" class="w-full">
                        </div>

                        <div class="flex gap-2">
                            <button onclick="cueDeck('B')" class="w-14 h-14 rounded-full bg-zinc-800 border-2 border-zinc-700 flex items-center justify-center font-black text-xs hover:bg-zinc-600">CUE</button>
                            <button onclick="playDeck('B')" id="playBtnB" class="w-14 h-14 rounded-full bg-zinc-800 flex items-center justify-center hover:bg-cyan-500 transition group">
                                <svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                            </button>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <!-- Browser Section -->
        <div class="h-64 glass-panel border-t-0 border-x-0 mx-2 mb-2 rounded-b-xl overflow-hidden flex flex-col">
            <div class="flex items-center justify-between px-6 py-3 border-b border-zinc-800 bg-zinc-900/50">
                <div class="flex gap-6 text-xs font-bold text-zinc-400">
                    <button class="text-white border-b-2 border-green-500 pb-1">ALL TRACKS</button>
                    <button class="hover:text-white">GENRES</button>
                    <button class="hover:text-white">MY MIXES</button>
                </div>
                <div class="flex items-center gap-4">
                    <span id="loadStatus" class="text-[9px] text-green-500 font-mono">GITHUB REPO SYNCED</span>
                </div>
            </div>

            <div class="flex-1 overflow-y-auto custom-scrollbar">
                <table class="w-full text-left text-sm border-separate border-spacing-0">
                    <thead class="text-zinc-500 sticky top-0 bg-zinc-900 z-10">
                        <tr>
                            <th class="px-6 py-2 border-b border-zinc-800 font-medium text-[10px]">TRACK</th>
                            <th class="px-6 py-2 border-b border-zinc-800 font-medium text-[10px]">FORMAT</th>
                            <th class="px-6 py-2 border-b border-zinc-800 font-medium text-[10px] text-right">ACTION</th>
                        </tr>
                    </thead>
                    <tbody id="libraryTable">
                        <!-- Tracks dinámicos -->
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <script>
        /* Configuración Global */
        const GITHUB_REPO = "ApoloSolInvictus/soundai";
        const AUDIO_PATH = "audio";

        /* Motor de Audio */
        const channelA = new Tone.Channel().toDestination();
        const channelB = new Tone.Channel().toDestination();
        
        const eqA = new Tone.EQ3(0, 0, 0).connect(channelA);
        const eqB = new Tone.EQ3(0, 0, 0).connect(channelB);

        const playerA = new Tone.Player().connect(eqA);
        const playerB = new Tone.Player().connect(eqB);

        const crossfade = new Tone.CrossFade().toDestination();
        channelA.connect(crossfade.a);
        channelB.connect(crossfade.b);

        /* Estado */
        let tracks = [];
        let state = {
            A: { playing: false, buffer: null, canvas: null, ctx: null, offset: 0 },
            B: { playing: false, buffer: null, canvas: null, ctx: null, offset: 0 }
        };

        /* Inicialización */
        window.onload = async () => {
            initCanvases();
            await loadFromGitHub();
            initKnobs();
            requestAnimationFrame(drawLoop);
        };

        function initCanvases() {
            ['A', 'B'].forEach(id => {
                const canvas = document.getElementById(`canvas${id}`);
                const rect = canvas.parentElement.getBoundingClientRect();
                canvas.width = rect.width;
                canvas.height = rect.height;
                state[id].canvas = canvas;
                state[id].ctx = canvas.getContext('2d');
            });
        }

        async function loadFromGitHub() {
            try {
                const res = await fetch(`https://api.github.com/repos/${GITHUB_REPO}/contents/${AUDIO_PATH}`);
                const files = await res.json();
                tracks = files.filter(f => f.name.endsWith('.mp3') || f.name.endsWith('.wav'));
                renderLibrary();
            } catch (e) {
                document.getElementById('loadStatus').innerText = "ERROR LOADING REPO";
                document.getElementById('loadStatus').className = "text-red-500 text-[9px]";
            }
        }

        function renderLibrary() {
            const table = document.getElementById('libraryTable');
            table.innerHTML = tracks.map((t, i) => `
                <tr class="hover:bg-white/5 transition group border-b border-zinc-800/50">
                    <td class="px-6 py-3 font-bold text-zinc-300">
                        <div class="flex items-center gap-3">
                            <div class="w-8 h-8 bg-zinc-800 rounded flex items-center justify-center text-[10px] text-zinc-500">${i+1}</div>
                            ${t.name.split('.')[0]}
                        </div>
                    </td>
                    <td class="px-6 py-3 text-zinc-500 font-mono text-[10px] uppercase">${t.name.split('.').pop()}</td>
                    <td class="px-6 py-3 text-right">
                        <div class="flex gap-2 justify-end">
                            <button onclick="loadToDeck('${t.download_url}', 'A', '${t.name}')" class="px-3 py-1 bg-orange-600/10 text-orange-500 rounded text-[9px] font-bold hover:bg-orange-600 hover:text-white transition">DECK A</button>
                            <button onclick="loadToDeck('${t.download_url}', 'B', '${t.name}')" class="px-3 py-1 bg-cyan-400/10 text-cyan-400 rounded text-[9px] font-bold hover:bg-cyan-400 hover:text-black transition">DECK B</button>
                        </div>
                    </td>
                </tr>
            `).join('');
        }

        /* Lógica de Decks */
        async function loadToDeck(url, id, name) {
            const status = document.getElementById('loadStatus');
            status.innerText = `LOADING ${id}...`;
            
            await Tone.start();
            const player = (id === 'A' ? playerA : playerB);
            
            try {
                const buffer = await new Tone.ToneAudioBuffer().load(url);
                player.buffer = buffer;
                state[id].buffer = buffer;
                document.getElementById(`title${id}`).innerText = name.split('.')[0];
                status.innerText = `READY ${id}`;
            } catch (err) {
                status.innerText = `LOAD FAILED`;
            }
        }

        function playDeck(id) {
            const player = (id === 'A' ? playerA : playerB);
            const btn = document.getElementById(`playBtn${id}`);
            
            if (player.state === "started") {
                player.stop();
                state[id].playing = false;
                btn.classList.remove(id === 'A' ? 'bg-orange-600' : 'bg-cyan-500');
                btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>`;
            } else if (player.buffer.loaded) {
                player.start();
                state[id].playing = true;
                btn.classList.add(id === 'A' ? 'bg-orange-600' : 'bg-cyan-500');
                btn.innerHTML = `<svg class="w-6 h-6 fill-current" viewBox="0 0 24 24"><path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/></svg>`;
            }
        }

        function drawLoop() {
            requestAnimationFrame(drawLoop);
            
            ['A', 'B'].forEach(id => {
                const { canvas, ctx, buffer, playing } = state[id];
                if (!buffer) return;

                const player = (id === 'A' ? playerA : playerB);
                const currentTime = player.seconds;
                const duration = buffer.duration;
                
                // Actualizar Relojes
                document.getElementById(`time${id}`).innerText = formatTime(currentTime);
                document.getElementById(`rem${id}`).innerText = "-" + formatTime(duration - currentTime);

                // Dibujar Waveform horizontal
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                
                const rawData = buffer.getChannelData(0);
                const pps = 100; // Pixeles por segundo
                const center = canvas.width / 2;
                const amp = canvas.height / 1.5;

                ctx.strokeStyle = id === 'A' ? '#ff5500' : '#00ccff';
                ctx.lineWidth = 2;
                ctx.beginPath();

                for (let x = 0; x < canvas.width; x++) {
                    const timeAtX = currentTime + (x - center) / pps;
                    if (timeAtX < 0 || timeAtX > duration) continue;

                    const index = Math.floor(timeAtX * buffer.sampleRate);
                    const val = rawData[index] || 0;
                    
                    const y = (canvas.height / 2) + (val * amp);
                    if (x === 0) ctx.moveTo(x, y);
                    else ctx.lineTo(x, y);
                }
                ctx.stroke();

                // VU Meter Fake (basado en amplitud si suena)
                if (playing) {
                    const vuVal = 40 + Math.random() * 60;
                    document.getElementById('masterVu').style.width = vuVal + '%';
                }
            });
        }

        function formatTime(s) {
            const m = Math.floor(s / 60);
            const sec = (s % 60).toFixed(1);
            return `${m < 10 ? '0' : ''}${m}:${sec < 10 ? '0' : ''}${sec}`;
        }

        function initKnobs() {
            document.querySelectorAll('.knob-input').forEach(knob => {
                let y = 0;
                let val = 0;

                knob.addEventListener('mousedown', e => {
                    y = e.clientY;
                    const move = em => {
                        const delta = y - em.clientY;
                        val = Math.max(-20, Math.min(10, val + delta * 0.5));
                        y = em.clientY;
                        
                        // Aplicar EQ
                        const deck = knob.dataset.deck;
                        const param = knob.dataset.param;
                        const eq = (deck === 'A' ? eqA : eqB);
                        eq[param].value = val;
                        
                        // Rotación visual
                        const deg = ((val + 20) / 30) * 270 - 135;
                        knob.style.transform = `rotate(${deg}deg)`;
                    };
                    const up = () => {
                        window.removeEventListener('mousemove', move);
                        window.removeEventListener('mouseup', up);
                    };
                    window.addEventListener('mousemove', move);
                    window.addEventListener('mouseup', up);
                });
            });

            // Sliders Faders
            document.getElementById('volA').oninput = e => channelA.volume.value = Tone.gainToDb(e.target.value);
            document.getElementById('volB').oninput = e => channelB.volume.value = Tone.gainToDb(e.target.value);
            document.getElementById('crossfader').oninput = e => crossfade.fade.value = e.target.value;
            
            // Pitch
            document.getElementById('pitchA').oninput = e => {
                playerA.playbackRate = e.target.value;
                document.getElementById('pitchValA').innerText = ((e.target.value - 1) * 100).toFixed(2) + "%";
            };
            document.getElementById('pitchB').oninput = e => {
                playerB.playbackRate = e.target.value;
                document.getElementById('pitchValB').innerText = ((e.target.value - 1) * 100).toFixed(2) + "%";
            };
        }
    </script>
</body>
</html>
